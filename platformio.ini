; ============================================================================
; PlatformIO Configuration for ESP32 Autonomous Micromouse Robot
; ============================================================================

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM10
monitor_port = COM10

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -O2

; Automatic dependency management: downloads required libraries at compile time
lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4
    Wire
